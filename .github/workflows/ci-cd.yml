name: CI/CD

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notebooks/**/*.html'
      - 'notebooks/**/*.pdf'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notebooks/**/*.html'
      - 'notebooks/**/*.pdf'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-api.txt
          python -m pip install pytest==8.3.3 httpx2==2.10.0

      - name: Run automated tests
        env:
          MODEL_PATH: models/resnet50_baseline.pt
        run: python -m pytest -q

  build-and-push:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Derive lowercase GHCR image reference
        id: image
        shell: bash
        run: |
          image_name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "ref=${image_name}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish immutable Git SHA tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy and smoke test
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
    permissions:
      contents: read
      packages: read
    concurrency:
      group: cats-dogs-production
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for the smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test dependencies
        run: python -m pip install httpx==0.27.2 pillow==10.4.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start the Git SHA image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          VCS_REF: ${{ github.sha }}
        run: |
          docker compose pull api
          docker compose build prometheus
          docker compose up --detach --no-build --remove-orphans --wait --wait-timeout 120

      - name: Run post-deployment smoke test
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
