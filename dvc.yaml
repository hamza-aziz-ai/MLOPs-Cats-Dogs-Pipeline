stages:
  download:
    cmd: >-
      python scripts/download_data.py
      --dataset-handle ${data.dataset_handle}
      --output-dir ${data.raw_dir}
    deps:
      - scripts/download_data.py
    params:
      - data.dataset_handle
      - data.raw_dir
    outs:
      - ${data.raw_dir}

  prepare:
    cmd: >-
      python scripts/prepare_data.py
      --raw-dir ${data.raw_dir}
      --output-dir ${data.processed_dir}
      --image-size ${data.image_size}
      --train-ratio ${data.train_ratio}
      --validation-ratio ${data.validation_ratio}
      --test-ratio ${data.test_ratio}
      --max-images-per-class ${data.max_images_per_class}
      --seed ${data.seed}
      --overwrite
    deps:
      - scripts/prepare_data.py
      - src/cats_dogs_mlops/preprocessing.py
      - ${data.raw_dir}
    params:
      - data.image_size
      - data.train_ratio
      - data.validation_ratio
      - data.test_ratio
      - data.max_images_per_class
      - data.seed
    outs:
      - ${data.processed_dir}

  train:
    cmd: >-
      python scripts/train.py
      --data-dir ${data.processed_dir}
      --model-path models/cat_dog_cnn.pt
      --metrics-path metrics/training_metrics.json
      --artifacts-dir artifacts
      --epochs ${training.epochs}
      --batch-size ${training.batch_size}
      --learning-rate ${training.learning_rate}
      --weight-decay ${training.weight_decay}
      --num-workers ${training.num_workers}
      --seed ${data.seed}
      --model-version ${training.model_version}
      --tracking-uri ${tracking.uri}
      --experiment-name ${tracking.experiment_name}
    deps:
      - scripts/train.py
      - src/cats_dogs_mlops/model.py
      - src/cats_dogs_mlops/preprocessing.py
      - ${data.processed_dir}
    params:
      - training
      - tracking
      - data.seed
    outs:
      - models/cat_dog_cnn.pt
      - artifacts/confusion_matrix.png
      - artifacts/loss_curves.png
      - artifacts/model_metadata.json
    metrics:
      - metrics/training_metrics.json:
          cache: false

