[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cats-dogs-mlops"
version = "1.0.0"
description = "End-to-end MLOps pipeline for Cats vs Dogs binary image classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "BITS Pilani WILP AIML Student" }]
dependencies = [
  "fastapi==0.115.0",
  "numpy==1.26.4",
  "pillow==10.4.0",
  "prometheus-client==0.21.0",
  "python-multipart==0.0.12",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "uvicorn[standard]==0.30.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cats_dogs_mlops"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

