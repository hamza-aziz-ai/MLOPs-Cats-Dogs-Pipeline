[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cats-dogs-mlops"
version = "1.0.0"
description = "End-to-end MLOps pipeline for Cats vs Dogs binary image classification"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "BITS Pilani WILP AIML Student" }]
dependencies = [
  "fastapi",
  "numpy",
  "pillow",
  "prometheus-client",
  "python-multipart",
  "torch",
  "torchvision",
  "uvicorn[standard]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cats_dogs_mlops"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

